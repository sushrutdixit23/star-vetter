name: Star Vetter Pipeline

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new targets to sample this run"
        required: false
        default: "150"

permissions:
  contents: write

concurrency:
  group: star-vetter-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline orchestrator
        env:
          STAR_VETTER_BATCH_SIZE: ${{ github.event.inputs.batch_size || '150' }}
        run: python f6_orchestrator.py "$GITHUB_WORKSPACE"

      - name: Export site data
        run: |
          python export_dashboard.py "$GITHUB_WORKSPACE"
          python export_pipeline_stats.py "$GITHUB_WORKSPACE"
          python export_extras.py "$GITHUB_WORKSPACE"
          python export_site_data.py "$GITHUB_WORKSPACE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site (sanity check before committing anything)
        working-directory: site
        run: npm run build

      - name: Commit pipeline results
        run: |
          git config user.name "star-vetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/dossiers site/public
          if git diff --cached --quiet; then
            echo "Nothing new to commit this run."
          else
            git commit -m "Automated pipeline run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Deploy to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ob7v7MrM3oA18xhRZwbqff7n
          VERCEL_PROJECT_ID: prj_8IaUM6m86FcMDokHecVh75fUYFaA
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
