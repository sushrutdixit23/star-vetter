name: Star Vetter Pipeline

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of new targets to sample this run"
        required: false
        default: "150"

permissions:
  contents: write
  actions: write   # to start the Pages workflow after the data commit (see 'Publish to GitHub Pages')

concurrency:
  group: star-vetter-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # A healthy run takes 30-45 minutes. 150 leaves room for a slow MAST day
    # but stops a stuck run from holding the queue for 4 hours (every scheduled
    # run from 2026-11-01 was cancelled at the old 240-minute limit).
    timeout-minutes: 150
    env:
      # stream logs live so Actions timestamps show when stages really ran
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in about a minute, before any work, if MAST or every VizieR server
      # is down. Without this a run spends hours timing out and then either
      # commits wrong data or gets cancelled. CDS XMatch is optional: when it is
      # down the cross-match runs through VizieR (crossmatch.py), and this step
      # tells the later steps which server to use. See upstream.py and
      # docs/upstream_outages.md.
      - name: Pre-flight - are the catalog services up?
        run: python3 upstream.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline orchestrator
        env:
          STAR_VETTER_BATCH_SIZE: ${{ github.event.inputs.batch_size || '150' }}
        run: python f6_orchestrator.py "$GITHUB_WORKSPACE"

      - name: Export site data
        run: |
          python export_dashboard.py "$GITHUB_WORKSPACE"
          python export_pipeline_stats.py "$GITHUB_WORKSPACE"
          python export_extras.py "$GITHUB_WORKSPACE"
          python export_site_data.py "$GITHUB_WORKSPACE"

      # Published files that are derived from the pipeline's CSVs and that CI checks cover every candidate and
      # match the pipeline counts (tests/test_export_audit.py, test_export_novelty_extra.py,
      # test_f15_neighbours.py). The first complete run after the 28 Oct outage added 150 targets and 3
      # candidates and left these three stale, so CI went red on main. All offline: they cannot fail on a
      # catalog outage.
      - name: Refresh derived site data
        run: |
          python export_independent.py "$GITHUB_WORKSPACE"
          python export_audit.py "$GITHUB_WORKSPACE"
          python f15_neighbours.py "$GITHUB_WORKSPACE"

      # Six-catalog cross-match for candidates that have none yet (cached for the rest). It asks the VizieR
      # mirror and fails closed (a failed query is QUERY_FAILED, never "no match"). If the mirror is down the
      # run still commits: the new candidates then say "Not checked against the extra catalogs" on their pages,
      # which is true, and the CI test that every candidate is covered stays red until a later run fills them.
      - name: Extra catalog cross-match for new candidates
        run: |
          python f14_novelty_extra.py "$GITHUB_WORKSPACE" \
            || echo "::warning title=Extra catalog cross-match did not run::The VizieR mirror was not answering. New candidates are published as not checked against the extra catalogs."
          python export_novelty_extra.py "$GITHUB_WORKSPACE"

      - name: Generate AI content (write-ups, about page, discoveries)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          python f8_generate_writeups.py "$GITHUB_WORKSPACE"
          python export_dashboard.py "$GITHUB_WORKSPACE"
          python check_about_content_drift.py "$GITHUB_WORKSPACE" --auto-fix
          python f10_generate_discoveries.py "$GITHUB_WORKSPACE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site (sanity check before committing anything)
        working-directory: site
        run: npm run build

      # Commit and deploy only from main, so a test run started on another
      # branch (workflow_dispatch) can never push data or publish the site.
      - name: Commit pipeline results
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "star-vetter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/dossiers site/public

          if git diff --cached --quiet; then
            echo "Nothing new to commit this run."
          else
            git commit -m "Automated pipeline run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # A local run may have pushed since this job checked out. Pull it
            # in now rather than letting a plain push get rejected and fail
            # the whole run. A conflict here is expected when both sides
            # touched the same processed CSVs - resolve_merge_conflicts.py
            # unions those by TIC instead of picking a side (same script,
            # same fix, as the 2026-09-27 local/CI merge).
            git fetch origin main
            if git merge origin/main --no-edit; then
              echo "Merged cleanly with origin/main, no conflicts."
            else
              echo "Merge conflicts against origin/main - auto-resolving with resolve_merge_conflicts.py..."
              python resolve_merge_conflicts.py "$GITHUB_WORKSPACE"
              git commit --no-edit
            fi

            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the workflow's own token does not start the Pages workflow, so without this step the
      # GitHub Pages copy would only update when a person pushes to main. workflow_dispatch is the one event
      # GITHUB_TOKEN is allowed to trigger.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      # Vercel is the second host. On 2026-11-12 its deploy failed with "Your team has an overdue balance" after
      # the data had already been committed, which turned every run red and hid a successful pipeline run behind a
      # billing problem. The deploy is therefore allowed to fail without failing the run, but never silently: the
      # next step writes a warning annotation and a line in the job summary. Remove continue-on-error once Vercel
      # is the only host again.
      - name: Deploy to Vercel
        id: vercel
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ob7v7MrM3oA18xhRZwbqff7n
          VERCEL_PROJECT_ID: prj_8IaUM6m86FcMDokHecVh75fUYFaA
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Say so when the Vercel deploy failed
        if: steps.vercel.outcome == 'failure'
        run: |
          echo "::warning title=Vercel deploy failed::The data was committed and the site is published on GitHub Pages. Check the Vercel account (billing) before relying on Vercel."
          echo "### Vercel deploy failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The pipeline run itself succeeded and its data is committed. GitHub Pages is the live copy. See the 'Deploy to Vercel' step for the reason." >> "$GITHUB_STEP_SUMMARY"

      # Keep the orchestrator log and run record when anything fails: they are
      # not committed (data/logs is git-ignored) and vanish with the runner.
      - name: Upload run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            data/logs/
            data/runs/
          retention-days: 14
          if-no-files-found: ignore
